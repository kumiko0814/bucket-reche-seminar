</style></head><body id="top"><div id="progress" aria-hidden="true"></div><header class="topbar"><div class="brand">BUCKET LIST <span>×</span> Re:che</div><nav aria-label="章へ移動"><a href="#B">お二人の歩み</a><a href="#C">迷いの壁</a><a href="#D">迷い中の方へ</a><a href="#E">クロージング</a></nav></header><section class="hero"><div><div class="overline">LIVE TALK — BUCKET LIST × Re:che</div><h1>迷っている気持ちも、<br>そのまま話そう。</h1><p>お二人の歩みから、気になるお金・家族・時間のことまで。<br>一つずつ、お話を聞いていきます。</p></div><figure><img src="https://prcdn.freetls.fastly.net/release_image/76741/44/76741-44-50a3d38aeae35de14ee7f52aebf6f0cf-3000x2000.jpg?width=1950&amp;height=1350&amp;quality=85%2C65&amp;format=jpeg&amp;auto=webp&amp;fit=bounds&amp;bg-color=fff" alt="BUCKET LISTのリョースケさん・ケイさんとご家族"><figcaption class="photo-caption">BUCKET LIST ／ リョウスケ ＆ ケイ</figcaption></figure></section><main id="questions"></main><footer class="page-footer"><a class="back-top" href="#top">ページの先頭へ ↑</a><div>BUCKET LIST × Re:che — LIVE TALK</div><a class="source" href="https://prtimes.jp/main/html/rd/p/000000044.000076741.html" target="_blank" rel="noopener">写真出典：株式会社Merone プレスリリース</a></footer><script>
const chapters={B:['お二人の歩み','5〜18分'],C:['迷いの壁を一つずつ','18〜45分'],D:['見送った方・迷い中の方へ','45〜55分'],E:['クロージング','55〜60分']};
const slides=[
['B-1','ケイさんへ','ケイさんが一番最初に売ったものは何でしたか？売れた瞬間、どんな気持ちでしたか？'],
['B-2','ケイさんへ','副業の始まりはハンドメイドのアクセサリーだったと聞きました。あの頃、一人でやっていて何がいちばん大変でしたか？'],
['B-3','ケイさんへ','ご自身で233点も売ってきたケイさんが、なぜ「改めて学ぼう」と思ったのですか？'],
['B-4','リョウスケさんへ','リョウスケさんは事業で本当に苦しい時期を経験されています。あの経験から、新しいことを始めるとき何を基準に決めていますか？'],
['B-5','お二人へ','お二人が「きっといつかじゃない、今なんだ」と言い切れるのはなぜですか？双子が生まれた直後の今、始めた理由も教えてください。'],
['C-1','お二人へ｜お金','正直に聞きます。最初にスクールの話を聞いたとき、「怪しい」「高い」と思いませんでしたか？'],
['C-2','ケイさんへ｜お金','『ブランドバッグは私を「幸せ」にしてくれない！』を書いたケイさんは、お金の使い方に厳しい方だと思います。それでも「ここにはお金を出す」と決めた基準は何でしたか？'],
['C-3','森川が答える｜お金','費用・お支払い方法・途中解約や返金の条件は、個別の場で書面と一緒にお渡しします。'],
['C-4','リョウスケさんへ｜家族','夫の立場で聞きます。もし奥さんから「このスクールに入りたい」と言われたら、夫として何が気になりますか？どう説明されたら安心できますか？'],
['C-5','お二人へ｜家族','お二人はこの話を、夫婦でどう話し合いましたか？反対や心配はありましたか？'],
['C-6','ケイさんへ｜時間','「家族の時間が減るのが心配」という声が多いです。双子育児の毎日の中で、実際いつ・どれくらい作業していますか？'],
['C-7','ケイさんへ｜自信','「自分にできるか自信がない」という声がいちばん多いです。ケイさんが最初につまずいた所と、どう乗り越えたか教えてください。'],
['C-8','お二人へ｜自信','スクールのサポートは実際どんな感じですか？質問したら、どんな返事が来ますか？'],
['C-9','お二人へ｜中身','在庫の置き場所と、売れ残ったものはどうしていますか？'],
['C-10','森川が答える｜中身','法律面、仕入れの割り当て、新品を扱いたい方、副業禁止の会社の方、海外在住の方、2〜4ヶ月目以降の推移、うまくいかなかった方はどうなるか。',['法律面','仕入れの割り当て','新品を扱いたい方','副業禁止の会社の方','海外在住の方','2〜4ヶ月目以降の推移','うまくいかなかった方はどうなるか']],
['C-11','お二人へ｜過去の失敗','過去にスクールや自己投資で「回収できなかった」経験はありますか？今回との違いは何だと感じていますか？'],
['D-1','リョウスケさんへ','一度「やらない」と決めたことが、あとで気持ちが変わった経験はありますか？そのとき何がきっかけでしたか？'],
['D-2','ケイさんへ','「ママになったからといって諦めないで」という言葉。今日迷っている方に向けて、この言葉の意味をもう一度教えてください。'],
['D-3','お二人へ','もし1年前の自分に声をかけられるなら、何と言いますか？'],
['D-4','森川から視聴者へ','一度見送った方も、状況が変わっていたら、またお話しできます。「もう一度話してみたい」と思った方は、コメントで教えてくださいね。'],
['E-1','お二人へ','最後に、今日来てくれた方へ、ひとことお願いします。'],
['E-2','視聴者へ','今日の感想を、ひとことで送ってください☺️ 読んで、個別にお返事します。']];

const root=document.getElementById('questions');for(const [letter,[title,time]] of Object.entries(chapters)){const section=document.createElement('section');section.className='chapter';section.id=letter;const header=document.createElement('header');header.className='chapter-heading';const mark=document.createElement('span');mark.className='chapter-letter';mark.textContent=letter;const heading=document.createElement('div');const h2=document.createElement('h2');h2.textContent=title;const period=document.createElement('div');period.className='chapter-time';period.textContent=time;heading.append(h2,period);header.append(mark,heading);section.append(header);for(const s of slides.filter(s=>s[0].startsWith(letter))){const article=document.createElement('article');article.className='question';article.id=s[0];const label=document.createElement('div');label.className='question-label';const qid=document.createElement('span');qid.className='qid';qid.textContent=s[0];const recipient=document.createElement('span');recipient.textContent=s[1];label.append(qid,recipient);article.append(label);if(s[3]){const ul=document.createElement('ul');ul.className='topics';for(const text of s[3]){const li=document.createElement('li');li.textContent=text;ul.append(li)}article.append(ul)}else{const h3=document.createElement('h3');h3.textContent=s[2];article.append(h3)}section.append(article)}root.append(section)}function progress(){const total=document.documentElement.scrollHeight-innerHeight;document.getElementById('progress').style.width=(total>0?scrollY/total*100:0)+'%'}addEventListener('scroll',progress,{passive:true});progress();
</script></body></html>
