-weight:600;line-height:1.8;letter-spacing:.035em;margin:0;overflow-wrap:anywhere}h1.long{font-size:clamp(17px,2.28vw,41px)}.portrait{align-self:center;position:relative}.portrait:before{content:"";position:absolute;inset:9px -9px -9px 9px;border:1px solid #b25e7833;border-radius:12px}.portrait img{position:relative;display:block;width:100%;aspect-ratio:3/2;object-fit:contain;object-position:center;border-radius:12px;filter:none}.guest-name{font-size:clamp(10px,1vw,18px);font-weight:600;letter-spacing:.08em;margin-top:1.4em;text-align:center}.guest-sub{font-size:clamp(8px,.68vw,13px);letter-spacing:.13em;color:var(--muted);text-align:center;margin-top:.6em}.topics{display:grid;grid-template-columns:1fr 1fr;gap:.65em 1.5em;margin:0;padding:0;list-style:none;font-size:clamp(15px,1.8vw,32px);line-height:1.6}.topics li{border-bottom:1px solid #34495a17;padding:0 0 .45em}.topics li:last-child{grid-column:1/-1}.footer{position:absolute;bottom:5.5%;left:6%;right:6%;display:flex;justify-content:space-between;align-items:center;z-index:3}.footer-left{display:flex;align-items:center;gap:1.3em}.count{font-size:clamp(10px,1vw,18px);letter-spacing:.12em;font-variant-numeric:tabular-nums}.progress{height:2px;background:#34495a18;width:13vw;max-width:240px}.progress span{display:block;height:100%;background:var(--accent);transition:width .25s}.controls{display:flex;gap:.6em;align-items:center}.controls button{border:1px solid #34495a20;background:#ffffff60;border-radius:50%;width:clamp(28px,3vw,50px);height:clamp(28px,3vw,50px);font-size:clamp(14px,1.2vw,22px);transition:.2s}.controls button:hover{background:white;border-color:var(--accent)}.controls button:disabled{opacity:.3;cursor:default}.controls .text-control{border:0;background:none;border-radius:0;width:auto;margin-right:.65em;font-size:clamp(9px,.8vw,15px);color:#6e7d8a}.source{position:absolute;bottom:1.6%;left:6%;font-size:clamp(7px,.56vw,10px);color:#87929c;text-decoration:none;z-index:2}.chapter-watermark{position:absolute;right:3%;top:8%;font-family:Georgia,serif;font-size:14vw;color:#b25e780a;line-height:1;pointer-events:none}dialog{border:0;border-radius:16px;background:#fafbfd;color:var(--ink);width:min(850px,92vw);max-height:85vh;padding:28px;box-shadow:0 30px 100px #34495a35}dialog::backdrop{background:#24364c77;backdrop-filter:blur(5px)}.dialog-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}.dialog-head h2{font-size:20px;margin:0}.dialog-head button{border:0;background:var(--pink);border-radius:50%;width:34px;height:34px}.toc-list{display:grid;grid-template-columns:1fr 1fr;gap:8px}.toc-list button{text-align:left;border:1px solid #34495a13;background:white;padding:12px;border-radius:8px;font-size:12px;line-height:1.6}.toc-list button.active{background:var(--pink);border-color:#b25e7866}.toc-list strong{color:var(--accent);margin-right:6px}.hint{font-size:11px;color:var(--muted);margin:18px 0 0}@media(min-aspect-ratio:16/9){h1{font-size:4.7vh}h1.long{font-size:4.05vh}.topics{font-size:3.2vh}.brand{font-size:2vh}.person{font-size:2.13vh}.eyebrow{font-size:1.87vh}}@media(max-width:600px){.toc-list{grid-template-columns:1fr}.stage{width:100vw;height:100svh;min-height:600px}.header{top:5%}.brand{font-size:13px}.live{font-size:9px}main{inset:15% 7% 18%}.eyebrow{font-size:11px;flex-wrap:wrap}.slide{grid-template-columns:1fr;gap:18px;align-content:start}.question-content{order:1}.portrait{display:none}h1{font-size:25px;line-height:1.8}h1.long{font-size:22px}.person{font-size:13px;margin-top:15px}.topics{font-size:19px}.footer{bottom:8%;left:7%;right:7%}.count{font-size:12px}.controls button{width:36px;height:36px;font-size:18px}.controls .text-control{font-size:11px}.progress{width:15vw}.source{font-size:8px;bottom:3%;left:7%}.chapter-watermark{font-size:40vw;top:17%}}
</style></head><body><div class="stage"><div class="chapter-watermark" aria-hidden="true" id="watermark">B</div><header class="header"><div class="brand">BUCKET LIST <span>×</span> Re:che</div><div class="live">LIVE TALK</div></header><main aria-live="polite"><div class="eyebrow"><span class="section" id="chapter"></span><span class="time" id="time"></span></div><div class="slide"><section class="question-content"><div class="person" id="person"></div><h1 id="question"></h1><ul class="topics" id="topics" hidden></ul></section><aside class="portrait"><img src="https://prcdn.freetls.fastly.net/release_image/76741/44/76741-44-50a3d38aeae35de14ee7f52aebf6f0cf-3000x2000.jpg?width=1950&amp;height=1350&amp;quality=85%2C65&amp;format=jpeg&amp;auto=webp&amp;fit=bounds&amp;bg-color=fff" alt="BUCKET LISTのリョースケさん・ケイさんとご家族" loading="eager"><div class="guest-name">リョウスケ ＆ ケイ</div><div class="guest-sub">BUCKET LIST</div></aside></div></main><footer class="footer"><div class="footer-left"><span class="count" id="count"></span><div class="progress" aria-hidden="true"><span id="bar"></span></div></div><nav class="controls" aria-label="スライド操作"><button class="text-control" id="tocOpen">目次</button><button class="text-control" id="full" aria-label="全画面に切り替える">全画面 ⤢</button><button id="prev" aria-label="前の質問">←</button><button id="next" aria-label="次の質問">→</button></nav></footer><a class="source" href="https://prtimes.jp/main/html/rd/p/000000044.000076741.html" target="_blank" rel="noopener">写真出典：株式会社Merone プレスリリース</a></div><dialog id="toc"><div class="dialog-head"><h2>今日のお話</h2><button id="tocClose" aria-label="目次を閉じる">×</button></div><div class="toc-list" id="tocList"></div><p class="hint">← → キーで移動 ／ F キーで全画面 ／ Home で最初へ ／ End で最後へ</p></dialog><script>
const chapters={B:['お二人の歩み','5〜18分'],C:['迷いの壁を一つずつ','18〜45分'],D:['見送った方・迷い中の方へ','45〜55分'],E:['クロージング','55〜60分']};
const slides=[
['B-1','ケイさんへ','ケイさんが一番最初に売ったものは何でしたか？売れた瞬間、どんな気持ちでしたか？'],
['B-2','ケイさんへ','副業の始まりはハンドメイドのアクセサリーだったと聞きました。あの頃、一人でやっていて何がいちばん大変でしたか？'],
['B-3','ケイさんへ','ご自身で233点も売ってきたケイさんが、なぜ「改めて学ぼう」と思ったのですか？'],
['B-4','リョウスケさんへ','リョウスケさんは事業で本当に苦しい時期を経験されています。あの経験から、新しいことを始めるとき何を基準に決めていますか？'],
['B-5','お二人へ','お二人が「きっといつかじゃない、今なんだ」と言い切れるのはなぜですか？双子が生まれた直後の今、始めた理由も教えてください。'],
['C-1','お二人へ｜お金','正直に聞きます。最初にスクールの話を聞いたとき、「怪しい」「高い」と思いませんでしたか？'],
['C-2','ケイさんへ｜お金','『ブランドバッグは私を「幸せ」にしてくれない！』を書いたケイさんは、お金の使い方に厳しい方だと思います。それでも「ここにはお金を出す」と決めた基準は何でしたか？'],
['C-3','森川が答える｜お金','費用・お支払い方法・途中解約や返金の条件は、個別の場で書面と一緒にお渡しします。'],
['C-4','リョウスケさんへ｜家族','夫の立場で聞きます。もし奥さんから「このスクールに入りたい」と言われたら、夫として何が気になりますか？どう説明されたら安心できますか？'],
['C-5','お二人へ｜家族','お二人はこの話を、夫婦でどう話し合いましたか？反対や心配はありましたか？'],
['C-6','ケイさんへ｜時間','「家族の時間が減るのが心配」という声が多いです。双子育児の毎日の中で、実際いつ・どれくらい作業していますか？'],
['C-7','ケイさんへ｜自信','「自分にできるか自信がない」という声がいちばん多いです。ケイさんが最初につまずいた所と、どう乗り越えたか教えてください。'],
['C-8','お二人へ｜自信','スクールのサポートは実際どんな感じですか？質問したら、どんな返事が来ますか？'],
['C-9','お二人へ｜中身','在庫の置き場所と、売れ残ったものはどうしていますか？'],
['C-10','森川が答える｜中身','法律面、仕入れの割り当て、新品を扱いたい方、副業禁止の会社の方、海外在住の方、2〜4ヶ月目以降の推移、うまくいかなかった方はどうなるか。',['法律面','仕入れの割り当て','新品を扱いたい方','副業禁止の会社の方','海外在住の方','2〜4ヶ月目以降の推移','うまくいかなかった方はどうなるか']],
['C-11','お二人へ｜過去の失敗','過去にスクールや自己投資で「回収できなかった」経験はありますか？今回との違いは何だと感じていますか？'],
['D-1','リョウスケさんへ','一度「やらない」と決めたことが、あとで気持ちが変わった経験はありますか？そのとき何がきっかけでしたか？'],
['D-2','ケイさんへ','「ママになったからといって諦めないで」という言葉。今日迷っている方に向けて、この言葉の意味をもう一度教えてください。'],
['D-3','お二人へ','もし1年前の自分に声をかけられるなら、何と言いますか？'],
['D-4','森川から視聴者へ','一度見送った方も、状況が変わっていたら、またお話しできます。「もう一度話してみたい」と思った方は、コメントで教えてくださいね。'],
['E-1','お二人へ','最後に、今日来てくれた方へ、ひとことお願いします。'],
['E-2','視聴者へ','今日の感想を、ひとことで送ってください☺️ 読んで、個別にお返事します。']];
const $=id=>document.getElementById(id);let current=0;function render(i){current=Math.max(0,Math.min(slides.length-1,i));const s=slides[current],c=s[0][0];$('chapter').textContent=c+' / '+chapters[c][0];$('time').textContent=chapters[c][1];$('watermark').textContent=c;$('person').textContent=s[1];$('question').textContent=s[2];$('question').className=s[2].length>70?'long':'';$('question').hidden=!!s[3];$('topics').hidden=!s[3];$('topics').style.display=s[3]?'grid':'none';$('topics').replaceChildren(...(s[3]||[]).map(t=>{const li=document.createElement('li');li.textContent=t;return li}));$('count').textContent=s[0]+'  /  '+String(current+1).padStart(2,'0')+' — 22';$('bar').style.width=((current+1)/slides.length*100)+'%';$('prev').disabled=current===0;$('next').disabled=current===slides.length-1;document.querySelectorAll('.toc-list button').forEach((b,j)=>b.classList.toggle('active',j===current));history.replaceState(null,'','#'+s[0]);}function fullscreen(){if(document.fullscreenElement)document.exitFullscreen();else document.documentElement.requestFullscreen?.().catch(()=>{});}slides.forEach((s,i)=>{const b=document.createElement('button');const strong=document.createElement('strong');strong.textContent=s[0];b.append(strong,document.createTextNode(s[1]+' / '+s[2].slice(0,23)+'…'));b.onclick=()=>{render(i);$('toc').close()};$('tocList').append(b)});$('prev').onclick=()=>render(current-1);$('next').onclick=()=>render(current+1);$('full').onclick=fullscreen;$('tocOpen').onclick=()=>$('toc').showModal();$('tocClose').onclick=()=>$('toc').close();document.addEventListener('keydown',e=>{if($('toc').open)return;if(['ArrowRight','ArrowDown','PageDown',' '].includes(e.key)){e.preventDefault();render(current+1)}else if(['ArrowLeft','ArrowUp','PageUp'].includes(e.key)){e.preventDefault();render(current-1)}else if(e.key==='Home')render(0);else if(e.key==='End')render(slides.length-1);else if(e.key.toLowerCase()==='f')fullscreen();});let startX=0;document.querySelector('.stage').addEventListener('touchstart',e=>startX=e.changedTouches[0].clientX,{passive:true});document.querySelector('.stage').addEventListener('touchend',e=>{const d=e.changedTouches[0].clientX-startX;if(Math.abs(d)>70)render(current+(d<0?1:-1))},{passive:true});render(Math.max(0,slides.findIndex(s=>s[0]===location.hash.slice(1))));
</script></body></html>
